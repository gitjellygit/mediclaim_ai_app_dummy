name: Claim App Automated Tests

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/claim-app-tests.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

# PR updates validate the current branch head with deterministic installs.
jobs:
  claim-app-tests:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/claim_ai_test?schema=public
      JWT_SECRET: claim-app-ci-only-signing-secret-32-characters
      HIPAA_BAA_CONFIRMED: "false"
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start PostgreSQL test database
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'app') THEN
              CREATE ROLE app LOGIN PASSWORD 'app';
            ELSE
              ALTER ROLE app WITH LOGIN PASSWORD 'app';
            END IF;
          END
          $;
          SELECT 'CREATE DATABASE claim_ai_test OWNER app'
          WHERE NOT EXISTS (
            SELECT 1 FROM pg_database WHERE datname = 'claim_ai_test'
          )\gexec
          SQL
          PGPASSWORD=app pg_isready -h localhost -p 5432 -U app -d claim_ai_test

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Apply database migrations
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Audit backend production dependencies
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

      - name: Lint backend
        working-directory: backend
        run: npm run lint

      - name: Run backend automated tests
        working-directory: backend
        run: npm test

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Compile frontend
        working-directory: frontend
        run: npx vite build

      - name: Seed browser-test user
        working-directory: backend
        run: node prisma/seed.js

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run browser end-to-end regressions
        working-directory: frontend
        run: npm run test:e2e:fast

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ github.run_number }}
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
