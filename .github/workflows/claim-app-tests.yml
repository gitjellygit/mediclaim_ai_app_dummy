name: Claim App Automated Tests

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/claim-app-tests.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  claim-app-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: claim_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d claim_ai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/claim_ai_test?schema=public
      JWT_SECRET: claim-app-ci-only-signing-secret-32-characters
      HIPAA_BAA_CONFIRMED: "false"
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Apply database migrations
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Lint backend
        working-directory: backend
        run: npm run lint

      - name: Run backend automated tests
        working-directory: backend
        run: npm test

      - name: Install frontend dependencies
        working-directory: frontend
        # Frontend package-lock currently predates the Playwright dependency.
        # npm ci is enabled for backend; frontend needs a separately reviewed lockfile refresh.
        run: npm install

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Compile frontend
        working-directory: frontend
        run: npx vite build

      - name: Seed browser-test user
        working-directory: backend
        run: node prisma/seed.js

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run browser end-to-end regressions
        working-directory: frontend
        run: npm run test:e2e:fast

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ github.run_number }}
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
