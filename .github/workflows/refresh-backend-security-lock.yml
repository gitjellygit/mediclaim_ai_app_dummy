name: Refresh Backend Security Lock

permissions:
  contents: write

on:
  push:
    branches:
      - feature/operations-team-management
    paths:
      - ".github/workflows/refresh-backend-security-lock.yml"

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/operations-team-management
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Upgrade audited backend runtime dependencies
        working-directory: backend
        run: npm install express@^4.22.3 multer@^2.5.0 zod@^4.6.7 --save
      - name: Verify production dependency audit
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high
      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- backend/package.json backend/package-lock.json; then
            echo "No dependency changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package.json backend/package-lock.json
          git commit -m "Patch audited backend runtime dependencies"
          git push origin HEAD:feature/operations-team-management
