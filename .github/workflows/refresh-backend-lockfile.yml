name: Refresh backend lockfile once

on:
  push:
    branches:
      - feature/production-readiness-completion

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: ${{ !contains(github.event.head_commit.message, '[backend-lock-refresh]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/production-readiness-completion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Refresh backend lockfile
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- backend/package-lock.json; then
            echo "Backend lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json
          git commit -m "chore: refresh backend lockfile [backend-lock-refresh]"
          git push origin HEAD:feature/production-readiness-completion
