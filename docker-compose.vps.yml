services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - prism_pg:/var/lib/postgresql/data
    networks:
      - prism_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile.vps
    restart: unless-stopped
    env_file:
      - .env.vps
    environment:
      NODE_ENV: ${NODE_ENV:-demo}
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      UPLOAD_DIR: /app/backend/uploads
    command: ["npm", "run", "start:prepared"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - prism_uploads:/app/backend/uploads
    ports:
      - "127.0.0.1:4001:4000"
    networks:
      - prism_internal

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile.vps
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "127.0.0.1:5174:80"
    networks:
      - prism_internal

volumes:
  prism_pg:
  prism_uploads:

networks:
  prism_internal:
    driver: bridge
